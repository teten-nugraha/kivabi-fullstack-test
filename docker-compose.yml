services:
  backend:
    build:
      context: ./kivabi-service
      dockerfile: Dockerfile
    container_name: kivabi-backend
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - kivabi-network
    restart: unless-stopped

  frontend:
    build:
      context: ./kivabi-frontend
      dockerfile: Dockerfile
      target: production
    container_name: kivabi-frontend
    ports:
      - "5174:4173"
    environment:
      - VITE_API_BASE_URL=http://backend:8080/api
    networks:
      - kivabi-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  kivabi-network:
    driver: bridge